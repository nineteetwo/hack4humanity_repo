<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Dolphy</title>
  <meta name="description" content="Log in to your Dolphy account and continue your daily mental wellness journey." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="auth-page">
    <button class="auth-page__back" id="btn-back" aria-label="Back to home">←</button>
    <button class="auth-page__theme-toggle theme-toggle theme-toggle--sm" onclick="ThemeManager.toggle()" aria-label="Toggle theme">
      <span class="theme-toggle__icon">🌙</span>
    </button>

    <div class="auth-card" role="main">
      <div class="auth-card__logo">🐬 Dolphy</div>
      <h1 class="auth-card__title">Welcome back 👋</h1>
      <p class="auth-card__subtitle">Ready to continue your wellness journey?</p>

      <form class="auth-form" id="login-form" novalidate>
        <div class="form-field">
          <input type="text" class="clay-input" id="login-email" placeholder="Email or username" required autocomplete="username" />
        </div>
        <div class="form-field">
          <input type="password" class="clay-input" id="login-password" placeholder="Password" required autocomplete="current-password" />
          <button type="button" class="password-toggle-btn" id="btn-toggle-login-pw" aria-label="Toggle password visibility">👁</button>
          <button type="button" class="forgot-btn" id="btn-forgot">Forgot?</button>
        </div>
        <button type="submit" class="clay-btn clay-btn--primary clay-btn--full" id="btn-login-submit">
          Log In 🌿
        </button>
      </form>

      <div class="auth-divider"><span>OR</span></div>

      <div class="auth-social">
        <button class="clay-btn clay-btn--social" id="btn-google-login">
          <span class="social-icon social-icon--google">G</span> Continue with Google
        </button>
        <button class="clay-btn clay-btn--social" id="btn-facebook-login">
          <span class="social-icon social-icon--fb">f</span> Continue with Facebook
        </button>
      </div>

      <p class="auth-legal">By logging in, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
      <p class="auth-switch">Don't have an account? <a href="signup.html" id="link-signup">Sign up free</a></p>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="login.js"></script>
</body>
</html>
